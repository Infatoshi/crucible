[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crucible"
version = "0.1.0"
description = "Multi-agent adversarial research swarm -- LLM agents compete to optimize ML artifacts, GPU as arbiter"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "torch>=2.5.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.46.1",
    "autoawq>=0.2.0",
    "datasets>=2.0.0",
    "numpy",
    "scipy",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["outputs"]

[dependency-groups]
dev = ["pytest", "ruff"]
